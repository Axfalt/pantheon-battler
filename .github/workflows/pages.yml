# Publishes the fight page: at every push to main that touches web/, the contents of web/ are
# copied to the gh-pages branch, which GitHub Pages serves ("deploy from a branch" mode).
# The engine is already built into web/engine-wasm.js (scripts/build-web.sh): no build here.
name: Page de combat

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: web/ → gh-pages
        run: |
          git subtree split --prefix web -b site
          git push --force origin site:gh-pages
